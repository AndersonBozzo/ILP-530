name: Verificacao com PostgreSQL (sem nota)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        projeto: [projeto-01-importacao, projeto-02-api]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ilp530_test
          POSTGRES_USER: ilp530_test
          POSTGRES_PASSWORD: ci_only_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ilp530_test -d ilp530_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ilp530_test
      SPRING_DATASOURCE_USERNAME: ilp530_test
      SPRING_DATASOURCE_PASSWORD: ci_only_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verificar Maven
        working-directory: ${{ matrix.projeto }}
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Guardar evidencias dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-${{ matrix.projeto }}
          path: |
            ${{ matrix.projeto }}/target/surefire-reports/
            ${{ matrix.projeto }}/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14
